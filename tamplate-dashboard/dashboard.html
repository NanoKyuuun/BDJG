<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDJG Studio OS — Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/sora@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/sora@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/sora@5/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/700.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F2F5FC; --ink:#0E1638; --muted:#616A8E; --line:#E3E8F4; --card:#fff;
  --blue:#1B4FD8; --blue2:#0B2FA6; --orange:#F97316; --orange2:#EA580C; --yellow:#FFC700;
  --green:#16A34A; --red:#E11D48; --violet:#7C3AED; --teal:#0D9488;
  --shadow:0 10px 30px rgba(16,32,84,.08); --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;color:var(--ink);
  background:
    radial-gradient(1100px 480px at 88% -10%, rgba(255,199,0,.16), transparent 60%),
    radial-gradient(900px 480px at -10% 20%, rgba(27,79,216,.10), transparent 60%),
    radial-gradient(760px 420px at 60% 110%, rgba(249,115,22,.10), transparent 60%),
    var(--bg);
  min-height:100vh;
}
h1,h2,h3,.sora{font-family:'Sora',sans-serif}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#C7CFE4;border-radius:99px}::-webkit-scrollbar-track{background:transparent}

/* ============ LAYOUT ============ */
.sidebar{position:fixed;inset:0 auto 0 0;width:268px;z-index:50;overflow-y:auto;
  background:linear-gradient(200deg,#0B2FA6,#1B4FD8 55%,#2563EB);color:#fff;padding:18px 14px 26px;
  transition:transform .3s ease}
.main{margin-left:268px;min-height:100vh;display:flex;flex-direction:column}
.view{padding:22px 26px 60px;max-width:1460px;width:100%;margin:0 auto}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .ttl{font-family:'Sora';font-weight:800;font-size:17px}
.topbar .spacer{flex:1}
.hamb{display:none}
button{font-family:'Inter',sans-serif;border:none;background:none;cursor:pointer;color:inherit}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:#EDF1FA;position:relative;transition:.2s}
.iconbtn:hover{background:#E0E7F6;transform:translateY(-1px)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 4px 10px rgba(249,115,22,.4)}

/* logo */
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.lsvg{width:56px;height:38px;flex:none}
.ltxt{font-family:'Sora';font-weight:800;font-size:19px;letter-spacing:.5px;line-height:1}
.ltxt b{display:block;font-size:8.5px;letter-spacing:3.5px;color:var(--yellow);font-weight:700;margin-top:4px}

/* nav */
.navgrp{font-size:9.5px;letter-spacing:2px;color:rgba(255,255,255,.5);font-weight:700;margin:16px 10px 6px}
.navitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;
  color:rgba(255,255,255,.85);font-weight:600;font-size:13.5px;margin-bottom:2px;transition:.18s}
.navitem:hover{background:rgba(255,255,255,.10);transform:translateX(2px)}
.navitem.on{background:linear-gradient(90deg,var(--orange),#FF9A3D);color:#fff;box-shadow:0 8px 20px rgba(249,115,22,.35)}
.navitem .ni{width:22px;text-align:center;font-size:15px}
.sidefoot{margin-top:22px;padding:14px;border-radius:16px;background:rgba(255,255,255,.08);font-size:11.5px;line-height:1.6;color:rgba(255,255,255,.75)}
.sidefoot b{color:#FFC700}

/* seg role */
.seg{background:#EDF1FA;border-radius:999px;padding:4px;display:flex;gap:2px}
.seg button{border-radius:999px;padding:7px 14px;font-weight:700;font-size:12px;color:var(--muted);transition:.2s}
.seg button.on{background:linear-gradient(90deg,var(--blue),#2563EB);color:#fff;box-shadow:0 6px 14px rgba(27,79,216,.35)}

/* search */
.searchwrap{position:relative}
.searchwrap input{width:230px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px 9px 34px;font:600 12.5px 'Inter';color:var(--ink);outline:none;transition:.2s}
.searchwrap input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(27,79,216,.12)}
.searchwrap .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px}
.sdrop{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:none;z-index:60}
.sdrop.show{display:block}
.sdrop button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;font-size:12.5px;font-weight:600;text-align:left}
.sdrop button:hover{background:#F4F7FF}

/* dropdown panels */
.panel{position:absolute;top:48px;right:0;width:330px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:none;z-index:70;overflow:hidden}
.panel.show{display:block;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.panel .ph{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font-weight:800;font-family:'Sora';font-size:13px;background:linear-gradient(90deg,#F8FAFF,#FFF7ED);border-bottom:1px solid var(--line)}
.panel .ph button{font-size:11px;font-weight:700;color:var(--blue)}
.notif li{list-style:none;display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid #F0F3FA;font-size:12.5px;align-items:flex-start}
.notif li:last-child{border:none}
.notif .nico{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:15px;background:#EDF1FA}
.notif li.unread{background:#FFF9F0}
.notif .tm{color:var(--muted);font-size:10.5px;margin-top:3px}
.avmenu button{display:flex;gap:9px;width:100%;padding:11px 16px;font-size:12.5px;font-weight:600;text-align:left}
.avmenu button:hover{background:#F4F7FF}

/* cards & grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.chead h3{font-size:14px;font-weight:700}
.cbody{padding:16px 18px}
.grid{display:grid;gap:16px}
.g-stats{grid-template-columns:repeat(4,1fr)}
.g-21{grid-template-columns:2fr 1fr}
.g-31{grid-template-columns:1fr 1fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.mt{margin-top:16px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:24px;font-weight:800}
.pagehead p{color:var(--muted);font-size:13px;margin-top:4px}
.hi{background:linear-gradient(90deg,var(--orange),var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent}

/* stat */
.stat{padding:16px 16px 14px;display:flex;justify-content:space-between;gap:10px;position:relative;overflow:hidden;transition:.2s}
.stat:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(16,32,84,.14)}
.stat .lb{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.stat .vl{font-family:'Sora';font-weight:800;font-size:24px;margin-top:6px}
.stat .dl{font-size:11px;font-weight:700;margin-top:5px}
.stat .ico{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 8px 18px rgba(16,32,84,.18)}
.gb{background:linear-gradient(135deg,#1B4FD8,#4F83FF)}.go{background:linear-gradient(135deg,#F97316,#FFB25A)}
.gy{background:linear-gradient(135deg,#F59E0B,#FFC700)}.gg{background:linear-gradient(135deg,#16A34A,#4ADE80)}
.gv{background:linear-gradient(135deg,#7C3AED,#A78BFA)}.gt{background:linear-gradient(135deg,#0D9488,#2DD4BF)}
.up{color:var(--green)}.dn{color:var(--red)}.wr{color:var(--orange2)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.4px}
.c-blue{background:#E7EDFF;color:#1B4FD8}.c-orange{background:#FFEDD5;color:#C2410C}.c-yellow{background:#FFF6CC;color:#A16207}
.c-green{background:#DCFCE7;color:#15803D}.c-red{background:#FFE4E6;color:#BE123C}.c-violet{background:#F3E8FF;color:#6D28D9}
.c-teal{background:#CCFBF1;color:#0F766E}.c-gray{background:#EEF1F7;color:#475069}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:12px;padding:9px 15px;font-weight:800;font-size:12px;transition:.18s;letter-spacing:.2px}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(90deg,var(--blue),#2563EB);color:#fff;box-shadow:0 8px 18px rgba(27,79,216,.3)}
.btn-o{background:linear-gradient(90deg,var(--orange),#FF9A3D);color:#fff;box-shadow:0 8px 18px rgba(249,115,22,.3)}
.btn-g{background:linear-gradient(90deg,var(--green),#22C55E);color:#fff;box-shadow:0 8px 18px rgba(22,163,74,.3)}
.btn-x{background:#EDF1FA;color:var(--ink)}
.btn-x:hover{background:#E0E7F6}
.btn-d{background:#FFE4E6;color:#BE123C}
.btn.sm{padding:6px 11px;font-size:11px;border-radius:10px}

/* kanban */
.kboard{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{min-width:256px;flex:1;background:#EDF1F9;border:1px solid var(--line);border-radius:16px;transition:.15s}
.kcol.over{outline:2px dashed var(--orange);outline-offset:-5px;background:#FFF6EA}
.kh{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-family:'Sora';font-weight:800;font-size:11.5px;letter-spacing:.8px}
.kh .cnt{background:#fff;border-radius:99px;padding:2px 9px;font-size:10.5px;color:var(--muted)}
.kbody{padding:4px 10px 12px;display:flex;flex-direction:column;gap:10px;min-height:130px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 4px 14px rgba(16,32,84,.06);cursor:grab;transition:.15s}
.kcard:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(16,32,84,.12)}
.kcard.dragging{opacity:.45;transform:rotate(2deg)}
.kcard h4{font-size:12.5px;font-weight:700;font-family:'Sora'}
.kcard .sub{font-size:11px;color:var(--muted);margin-top:3px}
.krow{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.ava{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.g1{background:linear-gradient(135deg,#1B4FD8,#4F83FF)}.g2{background:linear-gradient(135deg,#F97316,#FFB25A)}
.g3{background:linear-gradient(135deg,#F59E0B,#FFC700);color:#7A5B00}.g4{background:linear-gradient(135deg,#7C3AED,#A78BFA)}
.g5{background:linear-gradient(135deg,#0D9488,#2DD4BF)}
.avastack{display:flex}.avastack .ava{margin-left:-7px;border:2px solid #fff}.avastack .ava:first-child{margin-left:0}

/* tables */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid #F0F3FA;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.15s}
.tbl tbody tr:hover{background:#F6F9FF;cursor:pointer}
.thumb{width:52px;height:34px;border-radius:8px;object-fit:cover;display:block}
.minibar{height:6px;border-radius:99px;background:#EDF1F9;overflow:hidden;width:90px}
.minibar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--yellow))}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fchip{padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:11.5px;color:var(--muted);transition:.15s}
.fchip.on{background:linear-gradient(90deg,var(--blue),#2563EB);border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(27,79,216,.3)}

/* feed */
.feed{list-style:none}
.feed li{display:flex;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:flex-start}
.feed li:last-child{border:none}
.feed .fd{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.feed .tm{color:var(--muted);font-size:10.5px;margin-top:2px}

/* attention */
.att li{list-style:none;display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:13px;margin-bottom:9px;font-size:12.5px;font-weight:600}
.att li:last-child{margin:0}
.att .bar{width:5px;align-self:stretch;border-radius:99px;flex:none}
.att .warn{background:#FFF7ED}.att .warn .bar{background:var(--orange)}
.att .danger{background:#FFF1F2}.att .danger .bar{background:var(--red)}
.att .info{background:#F0F6FF}.att .info .bar{background:var(--blue)}

/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.calday{background:#F7F9FF;border:1px solid var(--line);border-radius:14px;min-height:150px;padding:9px;transition:.15s}
.calday.today{border-color:var(--orange);background:#FFF9F0;box-shadow:0 8px 20px rgba(249,115,22,.15)}
.calday .dh{font-size:10.5px;font-weight:800;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.calday.today .dh{color:var(--orange2)}
.ev{border-radius:10px;padding:8px 9px;font-size:10.5px;font-weight:700;margin-bottom:7px;color:#fff;cursor:pointer;transition:.15s;line-height:1.45}
.ev:hover{transform:scale(1.03)}
.ev small{display:block;font-weight:600;opacity:.85}
.ev-SHOOT{background:linear-gradient(135deg,#F97316,#FF9A3D)}.ev-MEETING{background:linear-gradient(135deg,#1B4FD8,#4F83FF)}
.ev-EDITING{background:linear-gradient(135deg,#F59E0B,#FFC700);color:#6B4E00}.ev-REVIEW{background:linear-gradient(135deg,#0D9488,#2DD4BF)}
.ev-DELIVERY{background:linear-gradient(135deg,#16A34A,#4ADE80)}

/* steps */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.step{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:800;letter-spacing:.5px;color:#A6AECB;padding:4px 8px;border-radius:99px;background:#F2F5FC}
.step i{width:8px;height:8px;border-radius:50%;background:#CBD3E8}
.step.done{background:#DCFCE7;color:#15803D}.step.done i{background:#16A34A}
.step.now{background:#FFEDD5;color:#C2410C}.step.now i{background:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(249,115,22,.12)}}

/* drawer */
#drawerOverlay{position:fixed;inset:0;background:rgba(10,18,50,.45);z-index:55;opacity:0;pointer-events:none;transition:.3s}
#drawerOverlay.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:#fff;z-index:60;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(10,18,50,.25);overflow-y:auto}
#drawer.show{transform:none}
.dr-head{position:relative;height:190px}
.dr-head img{width:100%;height:100%;object-fit:cover}
.dr-head .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.92);font-size:15px;display:grid;place-items:center;z-index:2}
.dr-head .ovl{position:absolute;inset:auto 0 0 0;padding:16px 20px;background:linear-gradient(transparent,rgba(8,14,40,.85));color:#fff}
.dr-tabs{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dr-tabs button{padding:7px 13px;border-radius:99px;font-size:11.5px;font-weight:800;color:var(--muted);background:#F2F5FC}
.dr-tabs button.on{background:linear-gradient(90deg,var(--orange),#FF9A3D);color:#fff}
.dr-body{padding:18px 20px 40px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv b{font-weight:700}.kv span{color:var(--muted)}

/* preview player */
.pv{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:#000;box-shadow:0 20px 44px rgba(10,18,50,.3)}
.pv img{width:100%;height:100%;object-fit:cover;opacity:.92}
.pv .playbtn{position:absolute;inset:0;margin:auto;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 14px 34px rgba(249,115,22,.5);transition:.2s}
.pv .playbtn:hover{transform:scale(1.08)}
.pv.playing .playbtn{opacity:0;pointer-events:none}
.pv .pvtag{position:absolute;top:12px;left:12px}
.pvbar{display:flex;align-items:center;gap:12px;padding:12px 4px 0}
.pvbar input[type=range]{flex:1;accent-color:var(--orange);height:5px}
.pvbar .t{font-family:'Sora';font-weight:700;font-size:12px;color:var(--muted);min-width:86px;text-align:right}
.cmt{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;align-items:flex-start;background:#FBFCFF}
.cmt .ts{flex:none;background:linear-gradient(90deg,var(--blue),#2563EB);color:#fff;border-radius:9px;padding:5px 9px;font-family:'Sora';font-weight:700;font-size:11px}

/* photos */
.phgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ph{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:.18s;aspect-ratio:1}
.ph img{width:100%;height:100%;object-fit:cover;transition:.3s}
.ph:hover img{transform:scale(1.06)}
.ph.sel{border-color:var(--orange);box-shadow:0 10px 24px rgba(249,115,22,.3)}
.ph .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:13px;font-weight:800;color:#C2410C}

/* chat */
.chatwrap{display:grid;grid-template-columns:270px 1fr;gap:0;overflow:hidden;height:560px}
.threads{border-right:1px solid var(--line);overflow-y:auto}
.threads button{display:flex;gap:10px;align-items:center;width:100%;padding:13px 14px;text-align:left;border-bottom:1px solid #F0F3FA;font-size:12.5px;font-weight:700}
.threads button.on{background:#FFF7ED}
.chatbox{display:flex;flex-direction:column}
.chatmsgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#FAFBFF}
.bub{max-width:72%;padding:10px 14px;border-radius:16px;font-size:12.5px;line-height:1.55;font-weight:500}
.bub small{display:block;font-size:9.5px;opacity:.6;margin-top:4px}
.bub.mine{align-self:flex-end;background:linear-gradient(135deg,var(--blue),#2563EB);color:#fff;border-bottom-right-radius:5px}
.bub.theirs{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.chatin{display:flex;gap:10px;padding:13px;border-top:1px solid var(--line)}
.chatin input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font:600 12.5px 'Inter';outline:none}
.chatin input:focus{border-color:var(--blue)}

/* misc */
.workbar{height:7px;border-radius:99px;background:#EDF1F9;overflow:hidden;margin-top:8px}
.workbar i{display:block;height:100%;border-radius:99px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;border-radius:99px;background:#D8DEEE;transition:.2s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch input:checked + .sl{background:linear-gradient(90deg,var(--green),#22C55E)}
.switch input:checked + .sl:before{transform:translateX(18px)}
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;gap:10px;align-items:center;background:#0E1638;color:#fff;border-radius:14px;padding:12px 16px;font-size:12.5px;font-weight:700;box-shadow:0 16px 40px rgba(10,18,50,.4);animation:tin .3s cubic-bezier(.2,.8,.2,1);border-left:4px solid var(--blue)}
.toast.t-success{border-left-color:var(--green)}.toast.t-warn{border-left-color:var(--orange)}.toast.t-error{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ch{position:relative;height:260px}
.ch.sm{height:220px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.formrow.full{grid-template-columns:1fr}
.field label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:600 12.5px 'Inter';outline:none;background:#FBFCFF}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(27,79,216,.1)}
.pcard{overflow:hidden;transition:.2s}
.pcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(16,32,84,.16)}
.pcard img{width:100%;height:150px;object-fit:cover}
.pcard .pb{padding:13px 14px}
.star{font-size:16px;transition:.15s}.star:hover{transform:scale(1.2)}

@media(max-width:1100px){.g-stats{grid-template-columns:repeat(2,1fr)}.g-21,.g-31,.g-2{grid-template-columns:1fr}.calgrid{grid-template-columns:repeat(4,1fr)}.phgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:960px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:30px 0 80px rgba(10,18,50,.3)}
  .main{margin-left:0}
  .hamb{display:grid}
  .searchwrap input{width:150px}
  .chatwrap{grid-template-columns:1fr;height:auto}
  .threads{max-height:170px}
  .chatmsgs{height:300px}
}
@media(max-width:640px){.g-stats{grid-template-columns:1fr}.calgrid{grid-template-columns:repeat(2,1fr)}.phgrid{grid-template-columns:repeat(2,1fr)}.seg button{padding:6px 9px;font-size:11px}}

/* ============ TOAST & LOG ============ */
function toast(msg,type){
 type=type||'info';
 var ic={info:'🔵',success:'✅',warn:'🟠',error:'⛔'}[type];
 var el=document.createElement('div');
 el.className='toast t-'+type;
 el.innerHTML='<span>'+ic+'</span><b>'+msg+'</b>';
 $('#toasts').appendChild(el);
 setTimeout(function(){el.style.opacity='0';el.style.transition='.4s';setTimeout(function(){el.remove();},400);},3200);
}

function killCharts(){charts.forEach(function(c){c.destroy();});charts=[];}
function revChart(id,type){
 var el=document.getElementById(id);if(!el||!window.Chart)return;
 var cols=['rgba(27,79,216,.85)','rgba(249,115,22,.85)','rgba(255,199,0,.9)'];
 charts.push(new Chart(el,{type:type==='line'?'line':'bar',
  data:{labels:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep'],datasets:[{label:'Revenue (jt)',data:[42,38,55,47,62,58,71,66,86],
   backgroundColor:type==='line'?'rgba(249,115,22,.15)':function(ctx){return cols[ctx.dataIndex%3];},borderColor:'#F97316',borderWidth:type==='line'?3:0,fill:type==='line',tension:.4,pointRadius:type==='line'?4:0,pointBackgroundColor:'#1B4FD8',borderRadius:9,maxBarThickness:34}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0E1638',padding:10,callbacks:{label:function(c){return ' '+rps(c.parsed.y*1e6);}}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#EDF1F9'},ticks:{callback:function(v){return v+'jt';}}}}}}));

function donut(id,labels,data,colors){
 var el=document.getElementById(id);if(!el||!window.Chart)return;
 charts.push(new Chart(el,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderWidth:3,borderColor:'#fff',hoverOffset:8}]},
  options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:14,font:{weight:600}}}}}}));
}
function animCounts(){
 document.querySelectorAll('[data-count]').forEach(function(el){
  var target=parseFloat(el.dataset.count),money=el.dataset.money;
  var t0=performance.now(),dur=900;
  function fmt(v){return money?rps(Math.round(v)):Math.round(v).toString();}
  function step(t){var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(target*e);if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
 });
}

var dragKind=null,dragId=null;
function attachKanban(kind){

  c.addEventListener('dragstart',function(e){dragKind=kind;dragId=c.dataset.id;c.classList.add('dragging');e.stopPropagation();});
  c.addEventListener('dragend',function(){c.classList.remove('dragging');});
 });
 document.querySelectorAll('.kcol[data-kind="'+kind+'"]').forEach(function(col){
  col.addEventListener('dragover',function(e){e.preventDefault();col.classList.add('over');});

  col.addEventListener('drop',function(e){e.preventDefault();col.classList.remove('over');
   var to=col.dataset.status;if(!dragId)return;
   if(kind==='proj'){var p=pById(dragId);if(p&&p.status!==to){var from=p.status;p.status=to;logAct('Admin','memindahkan stage project',from+' → '+to,p.id,'project','orange');toast(p.name+' → '+PROJ_ST[to][1],'success');renderView();}}
   else{var q=DATA.inquiries.find(function(x){return x.id===dragId;});if(q&&q.status!==to){q.status=to;logAct('Dhea','memindahkan inquiry',q.client+' → '+to,null,'sales','blue');toast(q.client+' → '+to,'success');renderView();}}
   dragId=null;});
 });
}

function pvToggle(){
 if(state.pv.playing){clearInterval(state.pv.timer);state.pv.playing=false;var b=$('#pvBox');if(b)b.classList.remove('playing');var bb=$('#pvBtn');if(bb)bb.textContent='▶';return;}
 state.pv.playing=true;var b2=$('#pvBox');if(b2)b2.classList.add('playing');var bb2=$('#pvBtn');if(bb2)bb2.textContent='⏸';
 state.pv.timer=setInterval(function(){state.pv.t=Math.min(state.pv.dur,state.pv.t+1);updPV();if(state.pv.t>=state.pv.dur)pvToggle();},250);
}

  renderView();}
 else if(a==='qt-client'){var qc=DATA.quotations.find(function(x){return x.id===el.dataset.id;});var act=el.dataset.act;
  if(act==='accept'){qc.status='ACCEPTED';DATA.invoices.push({id:'inv'+Date.now(),num:'INV-2026-098',proj:'p8',label:'DP 50%',amt:Math.round(qc.total/2),status:'ISSUED',due:'01 Sep 2026'});toast('Quotation diterima 🎉 Invoice DP terbit — portal project aktif.','success');logAct('Client','menerima quotation',qc.num,null,'sales','green');}
  else if(act==='revise'){qc.status='REVISION_REQUESTED';toast('Permintaan revisi quotation dikirim ke Admin','warn');}
  else{qc.status='DECLINED';toast('Quotation ditolak','error');}
  renderView();}
 else if(a==='rev-advance'){var rv=DATA.revisions.find(function(x){return x.id===el.dataset.id;});var ord=['REQUESTED','TRIAGE','IN_PROGRESS','INTERNAL_REVIEW','READY_FOR_CLIENT','APPROVED','CLOSED'];var ri=ord.indexOf(rv.status);if(ri<ord.length-1){rv.status=ord[ri+1];toast('Revision → '+REV_ST[rv.status][1],'success');logAct('Admin','mengubah status revision',REV_ST[rv.status][1],rv.proj,'revision','red');renderView();}}
 else if(a==='task-cycle'){var tk=DATA.tasks.find(function(x){return x.id===el.dataset.id;});var tord=['TODO','IN_PROGRESS','REVIEW','DONE'];var ti=tord.indexOf(tk.status);if(ti<tord.length-1){tk.status=tord[ti+1];tk.overdue=false;toast('Task "'+tk.title+'" → '+tk.status,'success');renderView();}}
 else if(a==='inv-record'){var iv=DATA.invoices.find(function(x){return x.id===el.dataset.id;});iv.status='PAID';toast(iv.num+' ditandai PAID (rekonsiliasi manual)','success');logAct('Admin','rekonsiliasi payment',iv.num+' → PAID',iv.proj,'finance','green');renderView();}
 else if(a==='pay-inv'){var pi=DATA.invoices.find(function(x){return x.id===el.dataset.id;});if(['ISSUED','OVERDUE'].indexOf(pi.status)<0)return;pi.status='PENDING';toast('Menghubungi payment gateway…','info');renderView();
  setTimeout(function(){pi.status='PAID';toast('Payment diterima — status PAID ✅','success');logAct('System','status pembayaran','PENDING → PAID ('+pi.num+')',pi.proj,'finance','green');DATA.notifications[state.role].unshift({ico:'💵',txt:'Pembayaran '+pi.num+' berhasil',time:'Baru saja',unread:true});renderTopbar();renderView();},1500);}
 else if(a==='exp-act'){var ex=DATA.expenses.find(function(x){return x.id===el.dataset.id;});
  if(el.dataset.act==='ok'){ex.status='APPROVED';toast('Expense disetujui','success');logAct('Admin','menyetujui expense',ex.desc,ex.proj,'finance','green');}
  else{DATA.expenses=DATA.expenses.filter(function(x){return x.id!==ex.id;});toast('Expense ditolak','error');}
  renderView();}
 else if(a==='feat'){var pf=DATA.portfolio.find(function(x){return x.id===el.dataset.id;});pf.feat=!pf.feat;toast(pf.feat?'Ditampilkan di Home Featured':'Dihapus dari featured','success');renderView();}
 else if(a==='vistoggle'){var pv2=DATA.portfolio.find(function(x){return x.id===el.dataset.id;});pv2.vis=pv2.vis==='PUBLIC'?'PRIVATE':'PUBLIC';toast('Visibility portfolio: '+pv2.vis,pv2.vis==='PUBLIC'?'success':'warn');renderView();}
 else if(a==='msg-thread'){state.msgThread=el.dataset.id;renderView();}
 else if(a==='avail'){var dd=el.dataset.day;var cur2=state.availSelf[dd];state.availSelf[dd]=cur2==='AVAILABLE'?'UNAVAILABLE':(cur2==='UNAVAILABLE'?'LIMITED':'AVAILABLE');renderView();}
 else if(a==='pv-play'){pvToggle();}
 else if(a==='pv-comment'){var inp=$('#pvComment');var v=inp.value.trim();if(!v)return;PREVIEWS.p2.comments.unshift({ts:fmtT(state.pv.t),txt:v,st:'OPEN'});toast('Komentar dikirim pada '+fmtT(state.pv.t),'success');logAct('Client','memberi komentar preview',fmtT(state.pv.t)+' — '+v,'p2','revision','orange');renderView();}
 else if(a==='photo-toggle'){var pid=el.dataset.id;if(state.selPhotos[pid]){delete state.selPhotos[pid];}else{if(Object.keys(state.selPhotos).length>=4){toast('Maksimal 4 foto untuk final edit','warn');return;}state.selPhotos[pid]=true;}renderView();}
 else if(a==='photo-submit'){if(Object.keys(state.selPhotos).length===0){toast('Pilih minimal 1 foto','warn');return;}state.photoSubmitted=true;toast('Pilihan foto dikirim ke studio 🎉','success');renderView();}
 else if(a==='download'){toast('Mengunduh '+el.dataset.msg+' …','success');}
 else if(a==='user-toggle'){var us=DATA.users.find(function(x){return x.id===el.dataset.id;});us.status=us.status==='ACTIVE'?'SUSPENDED':'ACTIVE';toast(us.name+' → '+us.status,us.status==='ACTIVE'?'success':'warn');renderView();}
});
$('#drawerOverlay').addEventListener('click',closeDrawer);
document.addEventListener('input',function(e){
 if(e.target.id==='globalSearch'){
  var q=e.target.value.toLowerCase();var drop=$('#sdrop');
  if(!q){drop.classList.remove('show');return;}
  var res=DATA.projects.filter(function(p){return p.name.toLowerCase().indexOf(q)>-1||p.client.toLowerCase().indexOf(q)>-1||p.id.indexOf(q)>-1;}).slice(0,5);
  drop.innerHTML=res.map(function(p){return '<button data-action="open-project" data-id="'+p.id+'">🎬 <span><b>'+p.name+'</b><small style="color:var(--muted)"> · '+p.client+'</small></span></button>';}).join('')||'<button>😕 Tidak ditemukan</button>';
  drop.classList.add('show');
 }
});
if(window.Chart){Chart.defaults.font.family="'Inter',sans-serif";Chart.defaults.color='#616A8E';}
renderApp();
</script>
</body>
</html>
