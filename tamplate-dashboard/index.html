<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDJG — Studio Workspace (Admin)</title>
<!-- Ganti LOGO_URL di JS dengan file asset logo asli (bdjg-blue.png) bila tersedia lokal -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-600.css">
<style>
:root{
  --bg:#090909; --s1:#111111; --s2:#171717; --s3:#1d1d1f;
  --bd:#2A2A2A; --bd2:#3a3a3a;
  --tx:#F2F1ED; --tx2:#A3A3A3; --tx3:#6B6B6B;
  --ac:#5C7CFF; --ac2:#7d97ff;
  --ok:#4CC38A; --warn:#E8A33D; --err:#E5484D;
  --r:12px;
  --mono:'JetBrains Mono',monospace;
  --sans:'Manrope',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:rgba(92,124,255,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input::placeholder{color:var(--tx3)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);letter-spacing:.06em}
.micro{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.muted{color:var(--tx2)}

/* ============ LAYOUT ============ */
#app{display:flex;min-height:100vh}
#sidebar{width:264px;flex:0 0 264px;background:#0b0b0b;border-right:1px solid var(--bd);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;transition:transform .25s ease}
.main{flex:1;margin-left:264px;min-width:0;display:flex;flex-direction:column}
#content{padding:24px 28px 64px;max-width:1600px;width:100%;margin:0 auto}

/* sidebar */
.logo-wrap{padding:20px 18px 14px;border-bottom:1px solid var(--bd)}
.logo-tile{display:flex;align-items:center;gap:12px}
.logo-img{height:44px;width:64px;object-fit:contain;filter:invert(1) hue-rotate(-14deg) saturate(1.5);border-radius:8px}
.logo-meta .micro{display:block}
.logo-meta .brand{font-weight:800;font-size:15px;letter-spacing:.02em}
#nav{flex:1;overflow-y:auto;padding:12px 10px 20px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;color:var(--tx2);font-weight:600;font-size:13px;transition:background .15s,color .15s;text-align:left}
.nav-item svg{width:16px;height:16px;flex:0 0 16px}
.nav-item:hover{background:var(--s2);color:var(--tx)}
.nav-item.active{background:var(--s2);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.nav-group{margin-top:14px}
.nav-group>button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 10px;color:var(--tx3);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.nav-group>button svg{width:12px;height:12px;transition:transform .2s}
.nav-group.closed>button svg{transform:rotate(-90deg)}
.nav-group.closed .nav-sub{display:none}
.nav-sub{padding:2px 0 2px 0}
.nav-sub .nav-item{padding-left:26px;font-size:12.5px;font-weight:500}
.side-foot{border-top:1px solid var(--bd);padding:14px 16px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--s3);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ac2);flex:0 0 34px}
.side-foot .who{flex:1;min-width:0}
.side-foot .who b{display:block;font-size:12.5px}
.side-foot .who span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--tx3)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:.15s;position:relative}
.icon-btn:hover{color:var(--tx);border-color:var(--bd2)}
.icon-btn svg{width:15px;height:15px}
.dot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--s2)}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 28px;background:rgba(9,9,9,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
#burger{display:none}
.crumb{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase;white-space:nowrap}
.crumb b{color:var(--tx2)}
.top-date{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--tx3);margin-left:auto;white-space:nowrap}
.searchbox{position:relative;width:min(380px,38vw)}
.searchbox input{width:100%;padding-left:34px}
.searchbox>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--tx3);pointer-events:none}
#searchRes{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:none;box-shadow:0 18px 50px rgba(0,0,0,.5);max-height:340px;overflow-y:auto}
#searchRes.open{display:block}
#searchRes .sr-h{padding:8px 12px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase}
#searchRes button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;text-align:left;font-size:13px}
#searchRes button:hover{background:var(--s2)}
#searchRes .sr-meta{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--tx3);letter-spacing:.1em}
.bell-wrap{position:relative}
#notifPanel{position:absolute;right:0;top:calc(100% + 8px);width:340px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;display:none;box-shadow:0 18px 50px rgba(0,0,0,.5);overflow:hidden;z-index:70}
#notifPanel.open{display:block}
#notifPanel .np-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd)}
#notifPanel .np-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd);font-size:12.5px}
#notifPanel .np-item:last-child{border-bottom:none}
#notifPanel .np-item.unread{box-shadow:inset 2px 0 0 var(--ac)}
#notifPanel .np-item .t{flex:1}
#notifPanel .np-item .t b{display:block;font-size:12.5px}
#notifPanel .np-item .t span{color:var(--tx2)}
#notifPanel .np-item time{font-family:var(--mono);font-size:9.5px;color:var(--tx3);white-space:nowrap}

/* page header (pattern 97) */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 22px;flex-wrap:wrap}
.phead .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ac2);text-transform:uppercase;margin-bottom:6px}
.phead h1{font-size:clamp(22px,2.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.phead p{color:var(--tx2);font-size:13px;margin-top:5px;max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ac);color:#0a0a0a;font-weight:800;font-size:12px;letter-spacing:.06em;padding:10px 16px;border-radius:10px;transition:.15s;text-transform:uppercase}
.btn:hover{background:var(--ac2)}
.btn.ghost{background:transparent;color:var(--tx2);border:1px solid var(--bd)}
.btn.ghost:hover{color:var(--tx);border-color:var(--bd2)}
.btn svg{width:13px;height:13px}
.btn.sm{padding:7px 12px;font-size:11px}

/* cards & grids */
.grid-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mcard{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;transition:border-color .15s}
.mcard:hover{border-color:var(--bd2)}
.mcard .micro{display:block;margin-bottom:8px}
.mcard .val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.mcard .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--tx3);margin-top:7px;display:flex;align-items:center;gap:6px}
.mcard .sub .up{color:var(--ok)} .mcard .sub .dn{color:var(--err)} .mcard .sub .wn{color:var(--warn)}
.mcard.alert{border-color:rgba(232,163,61,.4)}
.sec{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:12px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:16px 16px 12px;min-width:0}
.panel>.p-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel>.p-h h3{font-size:13px;font-weight:800;letter-spacing:.02em}
.panel>.p-h .micro{color:var(--tx3)}
.link{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ac2);text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.link:hover{color:var(--tx)}

/* attention queue */
.att-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px;color:var(--tx2);border-radius:6px}
.att-item:last-child{border-bottom:none}
.att-item:hover{color:var(--tx);background:var(--s2)}
.att-item .txt{flex:1;min-width:0}
.att-item .txt b{color:var(--tx)}
.att-item svg{width:13px;height:13px;color:var(--tx3);flex:0 0 13px}

/* schedule */
.sch-item{display:flex;gap:12px;padding:10px 4px;border-bottom:1px solid var(--bd)}
.sch-item:last-child{border-bottom:none}
.sch-item time{font-family:var(--mono);font-size:11px;color:var(--ac2);width:44px;flex:0 0 44px;padding-top:2px}
.sch-item .t{flex:1;min-width:0}
.sch-item .t b{display:block;font-size:13px}
.sch-item .t span{font-size:11.5px;color:var(--tx2)}
.sch-item .meta{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--tx3)}

/* activity */
.act-item{position:relative;padding:0 0 14px 18px;border-left:1px solid var(--bd);margin-left:4px;font-size:12.5px;color:var(--tx2)}
.act-item::before{content:"";position:absolute;left:-3.5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--bd2)}
.act-item:first-child::before{background:var(--ac)}
.act-item time{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--tx3);display:block}
.act-item b{color:var(--tx)}

/* pipeline strip */
.pipe{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pipe .st{flex:1;min-width:120px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.pipe .st .micro{display:block;margin-bottom:6px}
.pipe .st .n{font-size:18px;font-weight:800}
.pipe .st .bar{height:3px;background:var(--bd);border-radius:2px;margin-top:8px;overflow:hidden}
.pipe .st .bar i{display:block;height:100%;background:var(--ac);border-radius:2px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--bd);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);background:var(--s3);white-space:nowrap}
.badge i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px}
.b-info{color:var(--ac2);background:rgba(92,124,255,.1);border-color:rgba(92,124,255,.35)}
.b-success{color:var(--ok);background:rgba(76,195,138,.08);border-color:rgba(76,195,138,.35)}
.b-warning{color:var(--warn);background:rgba(232,163,61,.08);border-color:rgba(232,163,61,.4)}
.b-error{color:var(--err);background:rgba(229,72,77,.08);border-color:rgba(229,72,77,.4)}
.b-neutral{color:var(--tx3);background:var(--s2);border-color:var(--bd)}

/* tables */
.tscroll{overflow:auto;border:1px solid var(--bd);border-radius:14px;background:var(--s1)}
table.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--s1);z-index:1}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--s2)}
.tbl tbody tr[data-act]{cursor:pointer}
.cell-p{display:flex;align-items:center;gap:10px;min-width:0}
.cell-p img{width:44px;height:30px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);flex:0 0 44px}
.cell-p b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-p .mono{font-size:9px;color:var(--tx3);letter-spacing:.1em}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.toolbar select{padding:8px 10px;border-radius:9px;font-size:12px}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 272px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:10px}
.khead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px}
.khead .mono{font-size:10px;letter-spacing:.14em;color:var(--tx2)}
.kcount{font-family:var(--mono);font-size:9.5px;color:var(--tx3);background:var(--s2);border:1px solid var(--bd);padding:2px 8px;border-radius:999px}
.kcard{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .15s}
.kcard:hover{border-color:var(--bd2);transform:translateY(-2px)}
.kcard:last-child{margin-bottom:2px}
.kcard img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);margin-bottom:10px}
.kcard b{font-size:13px;display:block}
.kcard .cl{font-size:11.5px;color:var(--tx2);margin:2px 0 8px}
.kcard .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.kcard .dl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--tx3)}
.avstack{display:flex}
.avstack .avatar{width:24px;height:24px;flex:0 0 24px;font-size:8.5px;margin-left:-6px;border-color:var(--s2);background:var(--s3)}
.avstack .avatar:first-child{margin-left:0}
.alert-ic{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;letter-spacing:.08em}
.alert-ic svg{width:11px;height:11px}
.alert-ic.w{color:var(--warn)} .alert-ic.e{color:var(--err)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-title{font-size:16px;font-weight:800;letter-spacing:-.01em;min-width:170px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{padding:7px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--tx3)}
.seg button.on{background:var(--s2);color:var(--tx)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase;padding:4px 6px}
.cal-cell{min-height:96px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:7px;overflow:hidden}
.cal-cell.dim{opacity:.38}
.cal-cell.today{border-color:var(--ac)}
.cal-cell .d{font-family:var(--mono);font-size:10px;color:var(--tx2);margin-bottom:6px}
.ev{display:block;width:100%;text-align:left;font-size:10px;font-family:var(--mono);letter-spacing:.04em;padding:3px 6px;border-radius:6px;margin-bottom:4px;border:1px solid var(--bd);background:var(--s2);color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.shoot{border-color:rgba(92,124,255,.45);color:var(--ac2)}
.ev.meet{border-color:rgba(76,195,138,.4);color:var(--ok)}
.ev.dead{border-color:rgba(229,72,77,.45);color:var(--err)}
.ev.rev{border-color:rgba(232,163,61,.45);color:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase}
.legend i{width:8px;height:8px;border-radius:3px}

/* revision cards */
.rev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rev-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:16px}
.rev-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rev-card h4{font-family:var(--mono);font-size:12px;letter-spacing:.12em}
.rev-card .proj{font-size:13px;font-weight:700;margin-bottom:2px}
.rev-card .sub2{font-size:11.5px;color:var(--tx2)}
.prog{height:4px;background:var(--bd);border-radius:3px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:var(--ac)}
.prog-lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--tx3)}

/* charts */
.chart-row{display:grid;grid-template-columns:1.7fr 1fr;gap:12px;margin-top:12px}
svg text{font-family:var(--mono)}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dlegend{flex:1;min-width:150px}
.dlegend .li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);padding:4px 0}
.dlegend .li i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.dlegend .li .pc{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx3)}

/* availability */
.avail-grid{display:grid;grid-template-columns:200px repeat(6,1fr);gap:6px;align-items:center}
.avail-grid .hd{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;padding:6px}
.avail-grid .wn{font-size:12.5px;font-weight:700;padding:6px}
.avail-grid .wn span{display:block;font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.08em}
.chip{height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em}
.chip.A{color:var(--ok);border-color:rgba(76,195,138,.35)}
.chip.L{color:var(--warn);border-color:rgba(232,163,61,.4)}
.chip.U{color:var(--tx3)}
.chip.P{color:var(--ac2);border-color:rgba(92,124,255,.4)}

/* portfolio / content */
.pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pf-card{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--s1);cursor:pointer;transition:border-color .15s}
.pf-card:hover{border-color:var(--bd2)}
.pf-card img{width:100%;height:190px;object-fit:cover;display:block;transition:transform .4s ease}
.pf-card:hover img{transform:scale(1.03)}
.pf-card .bd{padding:12px 14px}
.pf-card b{font-size:14px}
.pf-card .mono{font-size:9px;color:var(--tx3);letter-spacing:.12em;display:block;margin-top:4px}
.svc-row{display:flex;gap:18px;align-items:baseline;padding:16px 6px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.svc-row:last-child{border-bottom:none}
.svc-row .idx{font-family:var(--mono);font-size:11px;color:var(--ac2)}
.svc-row h4{font-size:17px;font-weight:800;letter-spacing:-.01em;min-width:220px}
.svc-row .tags{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--tx2);border:1px solid var(--bd);border-radius:999px;padding:3px 9px}

/* messages */
.msg-wrap{display:grid;grid-template-columns:280px 1fr;gap:12px;height:calc(100vh - 240px);min-height:420px}
.thread-list{background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow-y:auto}
.thread{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd);width:100%;text-align:left;align-items:center}
.thread.on{background:var(--s2);box-shadow:inset 2px 0 0 var(--ac)}
.thread b{font-size:12.5px;display:block}
.thread span{font-size:11px;color:var(--tx3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.chat{background:var(--s1);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column}
.chat-h{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.chat-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:70%;padding:10px 13px;border-radius:12px;font-size:13px;background:var(--s2);border:1px solid var(--bd)}
.bub.me{align-self:flex-end;background:rgba(92,124,255,.12);border-color:rgba(92,124,255,.35)}
.bub time{display:block;font-family:var(--mono);font-size:8.5px;color:var(--tx3);margin-top:5px;letter-spacing:.1em}
.chat-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--bd)}
.chat-f input{flex:1}

/* empty state */
.empty{border:1px dashed var(--bd2);border-radius:16px;padding:64px 24px;text-align:center;color:var(--tx2)}
.empty svg{width:22px;height:22px;color:var(--tx3);margin-bottom:12px}
.empty .micro{color:var(--ac2);display:block;margin-bottom:8px}
.empty h4{font-size:16px;font-weight:800;color:var(--tx);margin-bottom:6px}
.empty p{font-size:12.5px;max-width:46ch;margin:0 auto 16px}

/* drawer */
#drawerWrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
#drawerWrap.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);background:var(--s1);border-left:1px solid var(--bd);z-index:81;transform:translateX(102%);transition:transform .25s ease;overflow-y:auto;padding:20px}
#drawer.open{transform:none}
#drawer img.cover{width:100%;height:170px;object-fit:cover;border-radius:12px;border:1px solid var(--bd);margin:14px 0}
.drow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.drow .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;padding-top:2px}
.psteps{margin:14px 0}
.pstep{display:flex;align-items:center;gap:10px;padding:6px 0;font-family:var(--mono);font-size:10px;letter-spacing:.12em}
.pstep i{width:8px;height:8px;border-radius:50%;background:var(--bd2);flex:0 0 8px}
.pstep.done{color:var(--tx2)} .pstep.done i{background:var(--ok)}
.pstep.active{color:var(--ac2)} .pstep.active i{background:var(--ac);box-shadow:0 0 0 3px rgba(92,124,255,.2)}
.pstep.next{color:var(--tx3)}

/* modal */
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
#modalWrap.open{display:flex}
#modal{width:min(480px,100%);background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:22px}
#modal h3{font-size:17px;font-weight:800;margin-bottom:4px}
#modal .msub{font-size:12px;color:var(--tx2);margin-bottom:16px}
.f-row{margin-bottom:12px}
.f-row label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.f-row input,.f-row select{width:100%}
.m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.success-box{text-align:center;padding:26px 10px}
.success-box .ok-ic{width:46px;height:46px;border-radius:50%;background:rgba(76,195,138,.12);border:1px solid rgba(76,195,138,.4);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.success-box .ok-ic svg{width:20px;height:20px}
.success-box h4{font-family:var(--mono);letter-spacing:.16em;font-size:12px;color:var(--ok);margin-bottom:8px}
.success-box p{font-size:12.5px;color:var(--tx2);margin-bottom:18px}

/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--s1);border:1px solid var(--bd);border-left:2px solid var(--ac);border-radius:10px;padding:10px 14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:tin .25s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* responsive */
@media(max-width:1200px){.grid-metrics{grid-template-columns:repeat(2,1fr)}.sec,.chart-row{grid-template-columns:1fr}.pf-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1023px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:none}
  .main{margin-left:0}
  #burger{display:flex}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none}
  #backdrop.open{display:block}
  .top-date{display:none}
  .msg-wrap{grid-template-columns:1fr;height:auto}
  .chat-b{min-height:280px}
}
@media(max-width:640px){
  #content{padding:16px 14px 60px}
  .topbar{padding:12px 14px}
  .grid-metrics{grid-template-columns:1fr 1fr}
  .mcard .val{font-size:20px}
  .pf-grid{grid-template-columns:1fr}
  .searchbox{width:100%}
  .avail-grid{grid-template-columns:140px repeat(6,minmax(44px,1fr));overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

function emptyOk(){return "Kelola data konten sesuai permission content.manage."}

/* charts */
function barChart(big){var W=big?620:560,H=big?210:150,max=80,bw=(W-60)/REV_MONTHS.length;var s='<svg viewBox="0 0 '+W+" "+H+'" width="100%">';for(var g=0;g<4;g++){var y=14+g*((H-44)/3);s+='<line x1="34" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#222" stroke-width="1"/><text x="0" y="'+(y+3)+'" font-size="8" fill="#6B6B6B">'+(max-g*(max/3)).toFixed(0)+"</text>"}REV_MONTHS.forEach(function(d,i){var h=(d.v/max)*(H-44),x=40+i*bw+bw*0.22,y=H-30-h;var cur=i===REV_MONTHS.length-1;s+='<rect x="'+x+'" y="'+y+'" width="'+bw*0.56+'" height="'+h+'" rx="3" fill="'+(cur?"#5C7CFF":"#2e2e2e")+'"><title>'+d.m+" — Rp "+d.v+" JT</title></rect>";s+='<text x="'+(x+bw*0.28)+'" y="'+(H-16)+'" font-size="8" fill="'+(cur?"#7d97ff":"#6B6B6B")+'" text-anchor="middle">'+d.m+"</text>"});return s+"</svg>"}
function donut(){var C=2*Math.PI*52,off=0,s='<svg viewBox="0 0 140 140" width="150"><circle cx="70" cy="70" r="52" fill="none" stroke="#1d1d1f" stroke-width="16"/>';EXP_CAT.forEach(function(c){var len=c.v/100*C;s+='<circle cx="70" cy="70" r="52" fill="none" stroke="'+c.c+'" stroke-width="16" stroke-dasharray="'+len+" "+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=len});s+='<text x="70" y="66" text-anchor="middle" font-size="13" fill="#F2F1ED" font-weight="700">Rp 96.4</text><text x="70" y="82" text-anchor="middle" font-size="8" fill="#6B6B6B">JT / 2026</text></svg>';return '<div class="donut-wrap">'+s+'<div class="dlegend">'+EXP_CAT.map(function(c){return '<div class="li"><i style="background:'+c.c+'"></i>'+c.n+'<span class="pc">'+c.v+"%</span></div>"}).join("")+"</div></div>"}
function finMini(l,v,s){return '<div class="mcard" style="flex:1;min-width:150px"><span class="micro">'+l+'</span><div class="val" style="font-size:19px">'+v+'</div><div class="sub">'+s+"</div></div>"}
function pipelineStrip(){var cols=["PRE-PRODUCTION","PRODUCTION","POST-PRODUCTION","CLIENT REVIEW","REVISION","COMPLETED"];return '<div class="pipe">'+cols.map(function(c){var n=PROJECTS.filter(function(p){return p.status===c}).length;return '<div class="st"><span class="micro">'+c+'</span><span class="n">'+n+'</span><div class="bar"><i style="width:'+Math.min(n/3*100,100)+'%"></i></div></div>'}).join("")+"</div>"}

/* calendar */
function calHead(){var names=["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];return '<div class="cal-head"><button class="icon-btn" data-act="cal-prev" aria-label="Sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><span class="cal-title">'+names[calState.m]+" "+calState.y+'</span><button class="icon-btn" data-act="cal-next" aria-label="Berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button><div class="seg"><button class="'+(calState.mode==="month"?"on":"")+'" data-act="cal-mode" data-mode="month">MONTH</button><button class="'+(calState.mode==="week"?"on":"")+'" data-act="cal-mode" data-mode="week">WEEK</button><button class="'+(calState.mode==="agenda"?"on":"")+'" data-act="cal-mode" data-mode="agenda">AGENDA</button></div><div class="legend"><span><i style="background:var(--ac)"></i>SHOOT</span><span><i style="background:var(--ok)"></i>MEETING</span><span><i style="background:var(--err)"></i>DEADLINE</span><span><i style="background:var(--warn)"></i>REVISION</span></div></div>'}
function key(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function calBody(){
 if(calState.mode==="agenda"){var ks=Object.keys(EVENTS).sort();return '<div class="panel">'+ks.map(function(k){return '<div class="sch-item"><time>'+k.slice(8)+"</time>"+EVENTS[k].map(function(e){return '<div class="t" style="margin-bottom:4px"><b class="ev '+e.ty+'" style="display:inline-block;width:auto">'+e.t+"</b> <span class='micro'>"+k.slice(0,7)+"</span></div>"}).join("")+"</div>"}).join("")+"</div>"}
 var y=calState.y,m=calState.m,first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),dow=["MIN","SEN","SEL","RAB","KAM","JUM","SAB"];
 var cells="";for(var i=0;i<first;i++){var pd=new Date(y,m,-(first-1-i));cells+='<div class="cal-cell dim"><span class="d">'+pd.getDate()+"</span></div>"}
 for(var d=1;d<=dim;d++){var k2=key(y,m,d),evs=EVENTS[k2]||[],today=(k2==="2026-09-08");cells+='<div class="cal-cell'+(today?" today":"")+'"><span class="d">'+d+"</span>"+evs.map(function(e){return '<button class="ev '+e.ty+'" data-act="demo" data-msg="EVENT — '+e.t.toUpperCase()+'">'+e.t+"</button>"}).join("")+"</div>"}
 return '<div class="cal-grid">'+dow.map(function(d){return '<span class="cal-dow">'+d+"</span>"}).join("")+cells+"</div>"}

/* messages render */
function renderChat(){var t=THREADS.find(function(x){return x.id===curThread});var tt=document.getElementById("chatTitle"),bb=document.getElementById("chatBody");if(!t||!bb)return;if(tt)tt.textContent=t.p+" — "+t.c;bb.innerHTML=t.msgs.map(function(m){return '<div class="bub'+(m.me?" me":"")+'">'+m.tx+"<time>"+(m.me?"ADMIN":"CLIENT")+" / "+m.tm+"</time></div>"}).join("");bb.scrollTop=bb.scrollHeight}

/* drawer */
function openDrawer(id){var p=PROJECTS.find(function(x){return x.id===id});if(!p)return;var d=document.getElementById("drawer");
 d.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between"><span class="micro">PROJECT SNAPSHOT</span><button class="icon-btn" data-act="close-drawer" aria-label="Tutup">'+ico("x")+"</button></div>"+
 '<img class="cover" src="'+p.cover+'" alt="">'+
 '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="font-size:17px;font-weight:800">'+p.name+"</h3>"+badge(p.status)+"</div>"+
 '<span class="mono" style="font-size:10px;color:var(--tx3);letter-spacing:.12em">'+p.id+"</span>"+
 '<div class="psteps">'+progSteps(p.status)+"</div>"+
 '<div class="drow"><span class="k">Client</span><b>'+p.client+'</b></div><div class="drow"><span class="k">Service</span><span>'+p.service+'</span></div><div class="drow"><span class="k">Deadline</span><span class="mono" style="font-size:11px">'+p.due+'</span></div><div class="drow"><span class="k">Admin</span><span>'+p.admin+'</span></div><div class="drow"><span class="k">Team</span>'+avstack(p.team)+'</div><div class="drow"><span class="k">Payment</span><span class="badge b-'+p.paySt+'"><i></i>'+p.pay+"</span></div>"+
 '<div style="display:flex;gap:8px;margin-top:18px"><button class="btn sm" data-act="demo" data-msg="OPEN PROJECT — '+p.id+'">OPEN PROJECT</button><button class="btn ghost sm" data-act="nav" data-view="calendar">SCHEDULE</button></div>';
 d.classList.add("open");document.getElementById("drawerWrap").classList.add("open")}

/* modal */
function openModal(){var m=document.getElementById("modal");m.innerHTML='<h3>New Project</h3><div class="msub">Project aktif setelah quotation accepted + DP terpenuhi.</div><form id="npForm"><div class="f-row"><label>Project Name</label><input required placeholder="cth: Wedding Film — Intan & Bayu"></div><div class="f-row"><label>Client</label><select><option>Alya & Raka</option><option>SMAN 3 Bandung</option><option>Kopi Arunika</option><option>Client baru…</option></select></div><div class="f-row"><label>Service</label><select><option>Wedding Film</option><option>Video Angkatan</option><option>Commercial</option><option>Short Film</option></select></div><div class="f-row"><label>Deadline</label><input type="date" value="2026-10-15"></div><div class="m-foot"><button type="button" class="btn ghost sm" data-act="close-modal">BATAL</button><button class="btn sm" type="submit">AKTIFKAN PROJECT</button></div></form>';
 document.getElementById("modalWrap").classList.add("open");

/* router */
function go(v){var view=VIEWS[v]||VIEWS.dashboard;document.getElementById("crumb").innerHTML="ADMIN / <b>"+view.crumb+"</b>";document.getElementById("content").innerHTML=view.render();setActiveNav(v);
 if(v==="messages")renderChat();
 if(v==="projects"){var s=document.getElementById("pfs");if(s){s.value=projFilter.st;document.getElementById("pfv").value=projFilter.sv;
  document.getElementById("pfq").addEventListener("input",function(e){projFilter.q=e.target.value.toLowerCase();go("projects");document.getElementById("pfq").focus()});
  s.addEventListener("change",function(e){projFilter.st=e.target.value==="ALL"?"ALL":e.target.value;go("projects")});
  document.getElementById("pfv").addEventListener("change",function(e){projFilter.sv=e.target.value;go("projects")})}}
 document.getElementById("sidebar").classList.remove("open");document.getElementById("backdrop").classList.remove("open");
 window.scrollTo({top:0})}

/* global events */
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-act]");
 if(!t){if(!e.target.closest(".searchbox"))document.getElementById("searchRes").classList.remove("open");if(!e.target.closest(".bell-wrap"))document.getElementById("notifPanel").classList.remove("open");return}
 var a=t.dataset.act;
 if(a==="nav")go(t.dataset.view);
 else if(a==="group")t.closest(".nav-group").classList.toggle("closed");
 else if(a==="burger"){document.getElementById("sidebar").classList.add("open");document.getElementById("backdrop").classList.add("open")}
 else if(a==="close-nav"){document.getElementById("sidebar").classList.remove("open");document.getElementById("backdrop").classList.remove("open")}
 else if(a==="bell"){var np=document.getElementById("notifPanel");if(!np.classList.contains("open")){np.innerHTML='<div class="np-h"><span class="micro">NOTIFICATIONS</span><button class="link" data-act="mark-read">MARK READ</button></div>'+NOTIFS.map(function(n){return '<div class="np-item'+(n.un?" unread":"")+'"><span class="avatar" style="width:28px;height:28px;flex:0 0 28px;font-size:9px">'+n.ch.slice(0,2)+'</span><div class="t"><b>'+n.ti+'</b><span>'+n.d+'</span></div><time>'+n.tm+"</time></div>"}).join("")}np.classList.toggle("open")}
 else if(a==="mark-read"){NOTIFS.forEach(function(n){n.un=false});document.getElementById("bellDot").style.display="none";document.getElementById("notifPanel").classList.remove("open");toast("SEMUA NOTIFIKASI DIBACA")}
 else if(a==="new-project")openModal();
 else if(a==="close-modal")closeModal();
 else if(a==="drawer")openDrawer(t.dataset.id);
 else if(a==="close-drawer")closeDrawer();
 else if(a==="cal-prev"){calState.m--;if(calState.m<0){calState.m=11;calState.y--}go("calendar")}
 else if(a==="cal-next"){calState.m++;if(calState.m>11){calState.m=0;calState.y++}go("calendar")}
 else if(a==="cal-mode"){calState.mode=t.dataset.mode;go("calendar")}
 else if(a==="thread"){curThread=t.dataset.id;go("messages")}
 else if(a==="send-msg"){var inp=document.getElementById("chatIn");var v=inp.value.trim();if(!v)return;var th=THREADS.find(function(x){return x.id===curThread});th.msgs.push({me:1,tx:v,tm:"09:45"});th.last=v;inp.value="";renderChat()}
 else if(a==="demo")toast(t.dataset.msg||"DEMO");
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeModal();closeDrawer();document.getElementById("searchRes").classList.remove("open");document.getElementById("notifPanel").classList.remove("open")}});

document.getElementById("searchIn").addEventListener("input",function(e){var q=e.target.value.toLowerCase();var r=document.getElementById("searchRes");if(q.length<2){r.classList.remove("open");return}
 var out="";var ps=PROJECTS.filter(function(p){return (p.name+p.client+p.id).toLowerCase().includes(q)});

 var iv=INVOICES.filter(function(i){return i.no.toLowerCase().includes(q)});
 if(iv.length)out+='<div class="sr-h">Invoices</div>'+iv.map(function(i){return '<button data-act="nav" data-view="invoices">'+ico("wallet")+"<span>"+i.no+"</span><span class='sr-meta'>"+i.amt+"</span></button>"}).join("");
 r.innerHTML=out||'<div class="sr-h">TIDAK DITEMUKAN</div>';r.classList.add("open")});
