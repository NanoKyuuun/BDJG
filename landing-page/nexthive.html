<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexthive Studio — Agency Portfolio & Team Contributions</title>
<meta name="description" content="Nexthive Studio membantu brand membangun website, identitas visual, dan strategi digital melalui kolaborasi tim kreatif multidisiplin.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/manrope@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/manrope@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/manrope@latest/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/manrope@latest/800.css">
<style>
:root{
  --bg:#081120; --bg2:#0b1a2e; --panel:#0d1e33; --line:rgba(120,180,220,.16);
  --cyan:#38c8f5; --cyan-b:#5ee1ff; --green:#1fd286; --text:#eaf4fb; --muted:#93a7bc;
  --e:cubic-bezier(.2,.7,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;line-height:1.65}
h1,h2,h3,h4,.font-disp{font-family:'Space Grotesk',sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit}
::selection{background:rgba(56,200,245,.35)}
.container{width:min(1180px,92%);margin:0 auto}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(45deg,rgba(140,180,220,.05) 0 1px,transparent 1px 110px),
  repeating-linear-gradient(-45deg,rgba(140,180,220,.05) 0 1px,transparent 1px 110px);}
#cursor{position:fixed;z-index:120;left:0;top:0;width:10px;height:10px;border-radius:50%;
  background:rgba(94,225,255,.85);pointer-events:none;transform:translate(-50%,-50%);
  box-shadow:0 0 18px rgba(94,225,255,.55);mix-blend-mode:screen;
  transition:width .3s var(--e),height .3s var(--e),background .3s;opacity:.9}
#cursor.big{width:46px;height:46px;background:rgba(94,225,255,.14)}
@media (hover:none){#cursor{display:none}}
main{position:relative;z-index:1}
/* ---------- HEADER ---------- */
#header{position:fixed;top:0;left:0;right:0;z-index:60;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:16px 4%;transition:background .4s,border-color .4s;border-bottom:1px solid transparent}
#header.scrolled{background:rgba(8,17,32,.82);backdrop-filter:blur(14px);border-color:var(--line)}
.burger{justify-self:start;width:44px;height:40px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center}
.burger span{display:block;width:24px;height:2px;background:var(--text);transition:.4s var(--e)}
.burger span:nth-child(2){width:17px}
body.menu-open .burger span:nth-child(1){transform:translateY(8px) rotate(45deg)}
body.menu-open .burger span:nth-child(2){opacity:0}
body.menu-open .burger span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.logo{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1}
.logo svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(94,225,255,.5))}
.logo-name{font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.42em;margin-top:4px;color:var(--text)}
.logo-sub{font-size:8px;letter-spacing:.6em;color:var(--cyan)}
.header-right{justify-self:end;display:flex;align-items:center;gap:16px}
.lang{font-size:11px;letter-spacing:.15em;color:var(--muted);display:flex;align-items:center;gap:6px}
.lang-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:11px;
  letter-spacing:.18em;padding:13px 22px;border-radius:4px;transition:transform .3s var(--e),box-shadow .3s,background .3s;cursor:pointer}
.btn-green{background:var(--green);color:#04140c;box-shadow:0 0 26px rgba(31,210,134,.35)}
.btn-green:hover{transform:translateY(-3px);box-shadow:0 8px 34px rgba(31,210,134,.5)}
.btn-ghost{border:1px solid rgba(94,225,255,.45);color:var(--cyan-b)}
.btn-ghost:hover{background:rgba(94,225,255,.1);transform:translateY(-3px)}
/* ---------- MENU OVERLAY ---------- */
#menuOverlay{position:fixed;inset:0;z-index:55;background:rgba(6,12,24,.96);backdrop-filter:blur(16px);
  transform:translateY(-102%);transition:transform .65s var(--e);display:flex;flex-direction:column;justify-content:center;padding:8vh 8vw}
body.menu-open #menuOverlay{transform:none}
body.menu-open{overflow:hidden}
.menu-link{display:block;font-family:'Space Grotesk';font-size:clamp(30px,5.4vw,58px);font-weight:700;color:var(--text);
  padding:6px 0;opacity:0;transform:translateY(30px);transition:.6s var(--e);width:max-content;position:relative}
.menu-link:hover{color:var(--cyan-b);letter-spacing:.04em}
.menu-link::before{content:'';position:absolute;left:-26px;top:50%;width:14px;height:2px;background:var(--green);transform:scaleX(0);transition:.3s;transform-origin:left}
.menu-link:hover::before{transform:scaleX(1)}
body.menu-open .menu-link{opacity:1;transform:none}
body.menu-open .menu-link:nth-child(1){transition-delay:.15s}body.menu-open .menu-link:nth-child(2){transition-delay:.22s}
body.menu-open .menu-link:nth-child(3){transition-delay:.29s}body.menu-open .menu-link:nth-child(4){transition-delay:.36s}
body.menu-open .menu-link:nth-child(5){transition-delay:.43s}body.menu-open .menu-link:nth-child(6){transition-delay:.5s}
.menu-foot{margin-top:6vh;display:flex;gap:26px;flex-wrap:wrap;color:var(--muted);font-size:13px;letter-spacing:.08em}
.menu-foot a:hover{color:var(--cyan-b)}
/* ---------- HERO ---------- */
.hero{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:120px 0 80px}
.scene{position:absolute;inset:0;pointer-events:none}
.moon{position:absolute;right:7%;top:20%}
.moon-in{width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 64% 36%,#d5dbca 0 11%,transparent 12%),radial-gradient(circle at 40% 64%,#dde2d3 0 7%,transparent 8%),#e9ede2;
  box-shadow:0 0 70px rgba(233,237,226,.28);animation:float 9s ease-in-out infinite}
.saturn{position:absolute;left:9%;top:44%}
.saturn-in{width:52px;height:52px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 32% 30%,#8fdcff,#1e88d0 70%);box-shadow:0 0 30px rgba(56,200,245,.45);animation:float 7s ease-in-out infinite}
.saturn-in::after{content:'';position:absolute;left:50%;top:50%;width:104px;height:30px;border:2px solid rgba(140,225,255,.55);
  border-radius:50%;transform:translate(-50%,-50%) rotate(-16deg)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.scene-bottom{position:absolute;left:50%;bottom:calc(min(1500px,170vw)*-.78);width:min(1500px,170vw);aspect-ratio:1;transform:translateX(-50%)}
.bp{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 42% 16%,#0d1c30 0 14%,transparent 15%),radial-gradient(circle at 62% 22%,#0e2036 0 10%,transparent 11%),
  radial-gradient(circle at 50% 10%,#14273f 0%,#0b1a2c 52%,#081120 100%);
  box-shadow:0 -30px 140px rgba(56,200,245,.16)}
.bp::before{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;border-top-color:var(--cyan-b);
  transform:rotate(28deg);filter:drop-shadow(0 0 14px rgba(94,225,255,.8))}
.orbit{position:absolute;animation:spin linear infinite}
.orbit.o1{inset:-6.5%;animation-duration:90s}
.orbit.o2{inset:-13.5%;animation-duration:140s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-content{position:relative;text-align:center;z-index:2}
.hero-kicker{color:var(--cyan);letter-spacing:.55em;font-weight:600;font-size:clamp(14px,2.4vw,24px);
  opacity:0;transform:translateY(24px);transition:.9s var(--e) .25s}
.hero-title{font-size:clamp(60px,12vw,148px);font-weight:700;color:var(--cyan-b);letter-spacing:.05em;line-height:1.05;
  text-shadow:0 0 60px rgba(56,200,245,.45)}
.hero-title .hl{display:inline-block;opacity:0;transform:translateY(70px) rotate(6deg);transition:transform .9s var(--e),opacity .9s var(--e)}
.hero-sub{color:var(--text);font-size:clamp(12px,1.5vw,15px);letter-spacing:.14em;margin-top:18px;
  opacity:0;transform:translateY(24px);transition:.9s var(--e) .9s}
.hero-cta{margin-top:34px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
  opacity:0;transform:translateY(24px);transition:.9s var(--e) 1.15s}
.hero.loaded .hero-kicker,.hero.loaded .hero-sub,.hero.loaded .hero-cta{opacity:1;transform:none}
.hero.loaded .hl{opacity:1;transform:none}
.scroll-hint{margin:56px auto 0;display:flex;flex-direction:column;align-items:center;gap:5px;
  opacity:0;transition:opacity 1s 1.6s}
.hero.loaded .scroll-hint{opacity:1}
.scroll-hint span{height:3px;border-radius:2px;background:var(--cyan);animation:hint 1.6s ease-in-out infinite}
.scroll-hint span:nth-child(1){width:30px}
.scroll-hint span:nth-child(2){width:20px;animation-delay:.15s}
.scroll-hint span:nth-child(3){width:10px;animation-delay:.3s}
@keyframes hint{0%,100%{opacity:.25}50%{opacity:1}}
/* ---------- MARQUEE ---------- */
.marquee{border-block:1px solid var(--line);overflow:hidden;padding:16px 0;background:rgba(10,22,38,.5);position:relative;z-index:1}
.marquee-track{display:flex;gap:56px;white-space:nowrap;width:max-content;animation:mar 32s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{font-family:'Space Grotesk';letter-spacing:.3em;font-size:13px;color:var(--muted)}
.marquee-track b{color:var(--green)}
@keyframes mar{to{transform:translateX(-50%)}}
/* ---------- SECTIONS ---------- */
.section{padding:110px 0;position:relative}
.overline{color:var(--cyan);letter-spacing:.45em;font-size:11px;font-weight:700;text-transform:uppercase}
.sec-title{font-size:clamp(28px,4vw,44px);letter-spacing:.02em;margin-top:10px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:52px;flex-wrap:wrap}
.link-more{color:var(--green);font-weight:800;font-size:11px;letter-spacing:.2em;display:inline-flex;align-items:center;gap:8px;transition:gap .3s}
.link-more:hover{gap:14px}
[data-reveal]{opacity:0;transform:translateY(30px);transition:opacity .9s var(--e),transform .9s var(--e)}
[data-reveal].in{opacity:1;transform:none}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:56px}
.stat{border:1px solid var(--line);border-radius:14px;padding:28px 22px;text-align:center;background:linear-gradient(180deg,rgba(16,32,54,.7),rgba(10,22,38,.7));transition:.4s}
.stat:hover{border-color:rgba(94,225,255,.4);transform:translateY(-6px)}
.stat b{font-family:'Space Grotesk';font-size:clamp(30px,4vw,46px);color:var(--cyan-b);display:block}
.stat span{color:var(--muted);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.about-grid p.lead{color:var(--muted);margin-top:18px}
.about-badge{border:1px solid var(--line);border-radius:16px;padding:34px;background:rgba(13,30,51,.6);position:relative;overflow:hidden}
.about-badge::before{content:'';position:absolute;top:-60px;right:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(31,210,134,.25),transparent 70%)}
.about-badge h4{color:var(--green);letter-spacing:.2em;font-size:12px;margin-bottom:14px}
.about-badge li{list-style:none;color:var(--muted);padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;display:flex;gap:10px}
.about-badge li::before{content:'✦';color:var(--cyan)}
.about-badge li:last-child{border:none}
/* services */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.svc{border:1px solid var(--line);border-radius:14px;padding:32px 26px;background:linear-gradient(180deg,rgba(16,32,54,.75),rgba(10,22,38,.75));position:relative;overflow:hidden;transition:.45s var(--e)}
.svc::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .5s var(--e)}
.svc:hover{transform:translateY(-8px);border-color:rgba(94,225,255,.4)}
.svc:hover::after{width:100%}
.svc .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--cyan-b);background:rgba(56,200,245,.1);border:1px solid rgba(94,225,255,.25);margin-bottom:20px}
.svc .ico svg{width:22px;height:22px}
.svc h3{font-size:18px;letter-spacing:.04em;margin-bottom:10px}
.svc p{color:var(--muted);font-size:14px}
/* cards */
.grid.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px}
.p-card{display:block;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(16,32,54,.85),rgba(10,22,38,.9));transition:transform .5s var(--e),border-color .4s,box-shadow .5s;animation:cardIn .6s var(--e) both}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.p-card:hover{transform:translateY(-9px);border-color:rgba(94,225,255,.5);box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 34px rgba(56,200,245,.14)}
.p-thumb{aspect-ratio:16/10;overflow:hidden;position:relative}
.p-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(8,17,32,.85))}
.p-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--e)}
.p-card:hover .p-thumb img{transform:scale(1.07)}
.p-body{padding:22px 22px 24px}
.p-meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}
.p-meta .yr{color:var(--muted)}
.p-body h3{font-size:19px;letter-spacing:.02em}
.p-client{color:var(--green);font-size:12px;letter-spacing:.12em;margin:4px 0 10px}
.p-desc{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:10.5px;letter-spacing:.08em;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.tag.g{border-color:rgba(31,210,134,.4);color:var(--green)}
.p-team-line{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;letter-spacing:.06em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:none}
/* team cards */
.grid.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:24px}
.m-card{border:1px solid var(--line);border-radius:14px;padding:30px 24px;text-align:center;background:linear-gradient(180deg,rgba(16,32,54,.85),rgba(10,22,38,.9));transition:.45s var(--e);animation:cardIn .6s var(--e) both;display:block}
.m-card:hover{transform:translateY(-8px);border-color:rgba(94,225,255,.5);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.m-ava{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;overflow:hidden;border:2px solid rgba(94,225,255,.5);box-shadow:0 0 26px rgba(56,200,245,.3);transition:.4s}
.m-card:hover .m-ava{box-shadow:0 0 40px rgba(94,225,255,.55)}
.m-ava img{width:100%;height:100%;object-fit:cover}
.m-card h3{font-size:18px}
.m-role{color:var(--cyan);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;margin:6px 0 14px}
.m-count{margin-top:16px;font-size:11px;letter-spacing:.16em;color:var(--green)}
/* process */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;position:relative;margin-top:20px}
.steps::before{content:'';position:absolute;top:27px;left:6%;right:6%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--green),transparent)}
.step{text-align:center;position:relative}
.step-num{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;color:var(--cyan-b);background:var(--bg2);border:1px solid rgba(94,225,255,.45);box-shadow:0 0 22px rgba(56,200,245,.25);position:relative;z-index:1;transition:.35s}
.step:hover .step-num{background:var(--cyan);color:#04202f;box-shadow:0 0 34px rgba(56,200,245,.6);transform:scale(1.08)}
.step h4{font-size:15px;letter-spacing:.06em;margin-bottom:8px}
.step p{color:var(--muted);font-size:12.5px}
/* testimonials */
.tst-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tst{border:1px solid var(--line);border-radius:14px;padding:30px;background:rgba(13,30,51,.65);position:relative;transition:.4s}
.tst:hover{transform:translateY(-6px);border-color:rgba(31,210,134,.45)}
.tst .q{font-family:'Space Grotesk';font-size:44px;color:var(--green);line-height:1;margin-bottom:12px}
.tst p{color:var(--muted);font-size:14px;font-style:italic}
.tst b{display:block;margin-top:18px;color:var(--text);font-size:13px}
.tst span{color:var(--cyan);font-size:11px;letter-spacing:.14em}
/* contact */
.contact-wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.c-info li{list-style:none;display:flex;gap:14px;align-items:center;color:var(--muted);padding:14px 0;border-bottom:1px dashed var(--line);font-size:14px}
.c-info .ci{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--cyan-b);background:rgba(56,200,245,.1);border:1px solid rgba(94,225,255,.25)}
.c-info .ci svg{width:18px;height:18px}
form.c-form{display:flex;flex-direction:column;gap:16px}
.c-form input,.c-form textarea{background:rgba(10,22,38,.75);border:1px solid var(--line);border-radius:10px;padding:15px 16px;color:var(--text);font-size:14px;outline:none;transition:.3s;resize:vertical}
.c-form input:focus,.c-form textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,200,245,.15)}
/* filters */
.filter-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:220px;background:rgba(10,22,38,.75);border:1px solid var(--line);border-radius:999px;padding:13px 22px;color:var(--text);font-size:14px;outline:none;transition:.3s}
.search:focus{border-color:var(--cyan)}
.select{background:rgba(10,22,38,.75);border:1px solid var(--line);border-radius:999px;padding:13px 20px;color:var(--muted);font-size:13px;outline:none;cursor:pointer}
.select option{background:var(--bg2)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px}
.chip{padding:9px 18px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;letter-spacing:.08em;transition:.3s;cursor:pointer}
.chip:hover{color:var(--text);border-color:rgba(94,225,255,.45)}
.chip.active{background:rgba(56,200,245,.14);border-color:var(--cyan);color:var(--cyan-b)}
.empty{padding:70px 0;text-align:center;color:var(--muted);letter-spacing:.1em}
/* page head */
.page-head{padding:170px 0 40px;position:relative}
.page-title{font-size:clamp(40px,6vw,72px);letter-spacing:.03em;margin-top:12px}
.page-title em{color:var(--cyan-b);font-style:normal}
.page-desc{color:var(--muted);max-width:640px;margin-top:14px}
/* detail */
.detail{padding-top:150px}
.back-link{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.2em;margin-bottom:34px;transition:.3s}
.back-link:hover{color:var(--cyan-b);gap:14px}
.pj-title{font-size:clamp(32px,5vw,58px);letter-spacing:.02em;margin:14px 0 8px}
.pj-cover{border-radius:18px;border:1px solid var(--line);overflow:hidden;box-shadow:0 34px 90px rgba(0,0,0,.55),0 0 60px rgba(56,200,245,.1);margin:44px 0}
.pj-cover img{width:100%;max-height:560px;object-fit:cover}
.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;border:1px solid var(--line);border-radius:14px;padding:26px;background:rgba(13,30,51,.6);margin-bottom:64px}
.meta-grid .mg span{display:block;font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}

.contrib-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* ============ STARFIELD CANVAS ============ */
(function(){
  const cv=$('#starfield'),ctx=cv.getContext('2d');
  let W,H,stars=[],comets=[],mouse={x:.5,y:.5},lastComet=0;
  function resize(){const d=Math.min(2,window.devicePixelRatio||1);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';makeStars();}
  function makeStars(){stars=[];const n=Math.floor(innerWidth*innerHeight/9000);
    for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.3+.3)*(W/innerWidth),p:Math.random()*Math.PI*2,s:.5+Math.random()*1.6,d:Math.random()});}
  addEventListener('resize',resize);resize();
  addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth;mouse.y=e.clientY/innerHeight;});
  function spawnComet(t){const d=W/innerWidth;const fromLeft=Math.random()>.5;
    comets.push({x:fromLeft?Math.random()*W*.4:Math.random()*W,y:Math.random()*H*.35,vx:(2.2+Math.random()*1.6)*d,vy:(2.2+Math.random()*1.6)*d,life:0,max:140+Math.random()*60,hue:Math.random()>.35});}
  function loop(t){
    ctx.clearRect(0,0,W,H);
    const d=W/innerWidth,px=(mouse.x-.5),py=(mouse.y-.5);
    for(const st of stars){
      const a=.35+.65*Math.abs(Math.sin(st.p+t*.001*st.s));
      const ox=px*30*st.d*d,oy=py*30*st.d*d;
      ctx.globalAlpha=a;ctx.fillStyle=st.r>1.1*d?'#bfeaff':'#eaf4fb';
      ctx.beginPath();ctx.arc(st.x+ox,st.y+oy,st.r,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(t-lastComet>2100&&comets.length<4){lastComet=t;spawnComet(t);}
    comets=comets.filter(c=>c.life<c.max&&c.x<W+300&&c.y<H+300);
    for(const c of comets){
      c.life++;c.x+=c.vx;c.y+=c.vy;
      const len=170*d,fade=Math.sin(Math.PI*Math.min(1,c.life/c.max));
      const tx=c.x-c.vx/Math.hypot(c.vx,c.vy)*len,ty=c.y-c.vy/Math.hypot(c.vx,c.vy)*len;
      const g=ctx.createLinearGradient(c.x,c.y,tx,ty);
      if(c.hue){g.addColorStop(0,'rgba(46,230,160,'+(.9*fade)+')');g.addColorStop(1,'rgba(46,230,160,0)');}
      else{g.addColorStop(0,'rgba(160,225,255,'+(.8*fade)+')');g.addColorStop(1,'rgba(160,225,255,0)');}
      ctx.strokeStyle=g;ctx.lineWidth=2*d;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(tx,ty);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,'+fade+')';ctx.beginPath();ctx.arc(c.x,c.y,2.2*d,0,7);ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

/* ============ REVEAL / COUNT ============ */
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');
  if(en.target.hasAttribute('data-count')&&!en.target.dataset.done){en.target.dataset.done=1;countUp(en.target);}
  io.unobserve(en.target);}});},{threshold:.15});
function observeReveals(root){$$('[data-reveal]',root).forEach(el=>io.observe(el));}
function countUp(el){const target=+el.dataset.count,suf=el.dataset.suffix||'',t0=performance.now();
  (function tick(t){const p=Math.min(1,(t-t0)/1500),e=1-Math.pow(1-p,3);
  el.textContent=Math.round(target*e)+suf;if(p<1)requestAnimationFrame(tick);})(t0);}

          <p>${t.desc}</p><p class="ctools">Tools: ${t.tools}</p></div>
        </a>`;}).join('')}</div></div></div>
    ${rel.length?`<div class="sec-head" style="margin-top:80px" data-reveal><div><p class="overline">RELATED</p><h2 class="sec-title">Project terkait</h2></div></div>
    <div class="grid projects">${rel.map(projectCard).join('')}</div>`:''}
  </div></section>`;
}
function pageMember(username){
  const m=MEMBERS.find(x=>x.username===username);
  if(!m) return pageTeam();
  const projs=projectsOf(username);
  const roles=uniq(projs.map(p=>p.team.find(t=>t.user===username).role));
  const tools=uniq(projs.flatMap(p=>p.team.find(t=>t.user===username).tools.split(', ')));
  return `<section class="detail"><div class="container">
    <a class="back-link" href="#/team">← KEMBALI KE TEAM</a>
    <div class="mem-head" data-reveal>
      <div class="mem-ava"><img src="${m.avatar}" alt="${m.name}"></div>
      <div>
        <p class="overline">PERSONAL PORTFOLIO</p>
        <h1>${m.name}</h1><p class="mrole">${m.role}</p>
        <p class="mhead-line">${m.headline}</p>
        <div class="mem-stats">
          <div class="ms"><b>${projs.length}</b><span>Projects</span></div>
          <div class="ms"><b>${roles.length}</b><span>Roles</span></div>
          <div class="ms"><b>${tools.length}</b><span>Tools</span></div>
        </div>
        <div class="socials">
          <a href="${m.socials.website}" aria-label="Website">${ICONS.globe}</a>
          <a href="${m.socials.github}" aria-label="GitHub">${ICONS.gh}</a>
          <a href="${m.socials.linkedin}" aria-label="LinkedIn">${ICONS.li}</a>
          <a href="${m.socials.instagram}" aria-label="Instagram">${ICONS.ig}</a>
        </div>
      </div>
    </div>
    <div class="case-block" data-reveal style="margin-top:60px"><div><span class="case-num">ABOUT</span><h3>Bio</h3></div><div class="case-body"><p>${m.bio}</p>
      <div class="tags" style="margin-top:18px">${m.skills.map(s=>`<span class="tag g">${s}</span>`).join('')}</div></div></div>
    <div class="sec-head" style="margin-top:50px" data-reveal><div><p class="overline">CONTRIBUTIONS</p><h2 class="sec-title">Project &amp; kontribusi</h2></div></div>
    ${projs.map((p,i)=>{const t=p.team.find(x=>x.user===username);return `
      <div class="m-contrib" data-reveal style="transition-delay:${i*80}ms">
        <a class="mc-thumb" href="#/projects/${p.slug}"><img src="${p.thumb}" alt="${p.title}" loading="lazy"></a>
        <div class="mc-body">
          <div class="p-meta"><span>${p.category}</span><span class="yr">${p.year}</span></div>
          <h3 style="font-size:20px"><a href="#/projects/${p.slug}">${p.title}</a></h3>
          <p class="crole" style="color:var(--cyan);font-size:11px;letter-spacing:.2em;margin:6px 0 10px">ROLE: ${t.role.toUpperCase()}</p>
          <p style="color:var(--muted);font-size:14px">${t.desc}</p>
          <div class="tags" style="margin-top:14px">${t.tools.split(', ').map(x=>`<span class="tag">${x}</span>`).join('')}</div>
        </div>
      </div>`;}).join('')}
  </div></section>`;
}
/* ============ FILTERS ============ */
let pjState={q:'',cat:'All',year:'All'},tState={q:'',role:'All'};
function renderPjChips(){const cats=['All',...uniq(PROJECTS.map(p=>p.category))];
  $('#pjChips').innerHTML=cats.map(c=>`<button class="chip ${pjState.cat===c?'active':''}" data-cat="${c}">${c==='All'?'Semua':c}</button>`).join('');}
function applyPj(){const list=PROJECTS.filter(p=>
  (pjState.cat==='All'||p.category===pjState.cat)&&
  (pjState.year==='All'||String(p.year)===pjState.year)&&
  (p.title+' '+p.client).toLowerCase().includes(pjState.q));
  $('#pjGrid').innerHTML=list.length?list.map(projectCard).join(''):`<p class="empty">✦ Tidak ada project yang cocok.</p>`;}
function renderTChips(){const roles=['All',...uniq(MEMBERS.map(m=>m.role))];
  $('#tChips').innerHTML=roles.map(r=>`<button class="chip ${tState.role===r?'active':''}" data-role="${r}">${r==='All'?'Semua Role':r}</button>`).join('');}
function applyTeam(){const list=MEMBERS.filter(m=>(tState.role==='All'||m.role===tState.role)&&m.name.toLowerCase().includes(tState.q))
  .sort((a,b)=>projectsOf(b.username).length-projectsOf(a.username).length);
  $('#tGrid').innerHTML=list.length?list.map(memberCard).join(''):`<p class="empty">✦ Tidak ada anggota yang cocok.</p>`;}
document.addEventListener('input',e=>{
  if(e.target.id==='pjSearch'){pjState.q=e.target.value.toLowerCase().trim();applyPj();}
  if(e.target.id==='tSearch'){tState.q=e.target.value.toLowerCase().trim();applyTeam();}
});
document.addEventListener('change',e=>{if(e.target.id==='pjYear'){pjState.year=e.target.value;applyPj();}});
document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip)return;
  if(chip.parentElement.id==='pjChips'){pjState.cat=chip.dataset.cat;renderPjChips();applyPj();}
  if(chip.parentElement.id==='tChips'){tState.role=chip.dataset.role;renderTChips();applyTeam();}
});
/* ============ HERO MOTION ============ */
function initHero(){
  const hero=$('.hero');if(!hero)return;
  const title=$('[data-split]',hero);
  if(title){const txt=title.textContent.trim();title.textContent='';
    [...txt].forEach((ch,i)=>{const s=document.createElement('span');s.className='hl';s.style.transitionDelay=(0.35+i*0.07)+'s';s.textContent=ch;title.appendChild(s);});}
  requestAnimationFrame(()=>requestAnimationFrame(()=>hero.classList.add('loaded')));
  let mx=.5,my=.5,raf=null;
  hero.addEventListener('mousemove',e=>{const r=hero.getBoundingClientRect();
    mx=(e.clientX-r.left)/r.width;my=(e.clientY-r.top)/r.height;
    if(!raf)raf=requestAnimationFrame(()=>{raf=null;
      $$('[data-depth]',hero).forEach(el=>{const d=+el.dataset.depth;
        el.style.transform=`translate(${(mx-.5)*d}px,${(my-.5)*d}px)`;});});});
}
/* ============ ROUTER ============ */
function render(){
  closeMenu();
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  let html;
  if(!parts.length)html=pageHome();
  else if(parts[0]==='projects'&&parts[1])html=pageProject(decodeURIComponent(parts[1]));
  else if(parts[0]==='projects')html=pageProjects();
  else if(parts[0]==='team'&&parts[1])html=pageMember(decodeURIComponent(parts[1]));
  else if(parts[0]==='team')html=pageTeam();
  else html=pageHome();
  $('#app').innerHTML=html+footerHTML();
  scrollTo({top:0,behavior:'instant'});
  observeReveals($('#app'));
  if(!parts.length)initHero();
  if(parts[0]==='projects'&&!parts[1]){pjState={q:'',cat:'All',year:'All'};renderPjChips();applyPj();}
  if(parts[0]==='team'&&!parts[1]){tState={q:'',role:'All'};renderTChips();applyTeam();}
}
addEventListener('hashchange',render);
render();
</script>
</body>
</html>
